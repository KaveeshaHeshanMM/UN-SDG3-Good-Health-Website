<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>sign-in</title>
  </head>
  <body>
    <div class="sign-in">
      <div class="h1-tag">
        <h1>Login</h1>
      </div>

      <div class="log-img">
        <img src="Icons/icons8-account-skin-type-2-96.png" alt="" />
      </div>

      <form>
        <div class="div-mail">
          <label for="uname"><b>Username: </b></label>
          <input
            type="text"
            placeholder="Enter Username"
            name="uname"
            class="email"
            required
          />
        </div>
        <div class="div-pass">
          <label for="psw"><b>Password: </b></label>
          <input
            type="password"
            placeholder="Enter Password"
            name="psw"
            class="password"
            required
          />
        </div>
        <div class="div-btn">
          <button type="submit" class="login-btn">Login</button>
        </div>
        <div class="div-checkbox">
          <label
            ><input
              type="checkbox"
              checked="checked"
              name="remember"
              class="check-box"
            />
            Remember me</label
          >
        </div>
      </form>
    </div>
  </body>
</html>
